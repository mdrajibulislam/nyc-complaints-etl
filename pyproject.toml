[project]
name = "nyc-complaints-etl"
version = "1.0.0"
description = "ETL, data-quality gate and screening analysis over NYC DCWP consumer-complaint and enforcement data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MD Rajibul Islam" }]
keywords = ["etl", "data-quality", "open-data", "nyc", "socrata"]

dependencies = [
    "pandas>=2.0",
    "requests>=2.28",
]

[project.scripts]
nyc-complaints-etl = "nyc_complaints_etl.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_complaints_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
